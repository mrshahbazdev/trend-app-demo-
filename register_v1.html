<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrendUp — Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0F172A; margin: 0; }
        .light-pattern {
            background-color: #f8fafc;
            background-image: radial-gradient(#e2e8f0 0.5px, transparent 0.5px), radial-gradient(#e2e8f0 0.5px, #f8fafc 0.5px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }
        .strength-bar { height: 4px; border-radius: 2px; transition: all 0.3s ease; }
        .input-focus:focus { outline: none; border-color: #dc2626; box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1); }
    </style>
</head>
<body>

<!-- PART 1 - FIXED TOP HEADER -->
<div style="position:fixed;top:0;left:0;right:0;z-index:50;background:#0F172A;border-bottom:1px solid rgba(255,255,255,0.06);">
  <div style="height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:12px;font-weight:600;color:#F8FAFC;">
    <span>9:41</span>
    <div style="display:flex;gap:5px;"><i class="fas fa-signal" style="font-size:12px"></i><i class="fas fa-wifi" style="font-size:12px"></i><i class="fas fa-battery-full" style="font-size:12px"></i></div>
  </div>
  <div style="height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;">
    <div style="display:flex;align-items:center;gap:10px;">
      <img src="IMG" alt="TrendUp" style="height:28px;object-fit:contain;border-radius:6px" />
      <span style="font-size:18px;font-weight:800;color:white;">TrendUp</span>
    </div>
    <div style="display:flex;gap:12px;"><i class="fas fa-bell" style="font-size:18px;color:#F8FAFC80"></i><i class="fas fa-search" style="font-size:18px;color:#F8FAFC80"></i></div>
  </div>
</div>

<!-- PART 2 - CONTENT -->
<div class="light-pattern min-h-screen" style="padding-top:96px; padding-bottom:80px;">
    <div class="px-6 py-8">
        <!-- Progress Indicator -->
        <div class="flex flex-col items-center mb-8">
            <h1 class="text-2xl font-800 text-slate-900 mb-2">Create your account</h1>
            <div class="flex items-center gap-2 mb-1">
                <div class="w-2 h-2 rounded-full bg-[#dc2626]"></div>
                <div class="w-2 h-2 rounded-full bg-slate-300"></div>
                <div class="w-2 h-2 rounded-full bg-slate-300"></div>
            </div>
            <span class="text-xs font-bold text-slate-500 uppercase tracking-widest">Step 1 of 3</span>
        </div>

        <div class="space-y-5">
            <!-- Handle Input -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Choose a handle</label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-medium">@</span>
                    <input type="text" placeholder="username" value="cryptoknight" class="w-full bg-white border border-slate-200 rounded-xl py-3.5 pl-9 pr-12 text-slate-900 font-medium input-focus">
                    <div class="absolute right-4 top-1/2 -translate-y-1/2">
                        <i class="fas fa-circle-check text-emerald-500"></i>
                    </div>
                </div>
                <p class="text-[11px] text-emerald-600 mt-1 font-medium px-1">Handle is available</p>
            </div>

            <!-- Display Name -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Display name</label>
                <input type="text" placeholder="How others see you" class="w-full bg-white border border-slate-200 rounded-xl py-3.5 px-4 text-slate-900 font-medium input-focus">
            </div>

            <!-- Password -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Password</label>
                <div class="relative mb-2">
                    <input type="password" value="S3cureP@ss!" placeholder="••••••••" class="w-full bg-white border border-slate-200 rounded-xl py-3.5 px-4 text-slate-900 font-medium input-focus">
                    <button class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400">
                        <i class="fas fa-eye-slash"></i>
                    </button>
                </div>
                <!-- Strength Meter -->
                <div class="flex gap-1.5 px-1 mb-3">
                    <div class="strength-bar flex-1 bg-emerald-500"></div>
                    <div class="strength-bar flex-1 bg-emerald-500"></div>
                    <div class="strength-bar flex-1 bg-emerald-500"></div>
                    <div class="strength-bar flex-1 bg-slate-200"></div>
                </div>
                <div class="flex justify-between items-center px-1">
                    <span class="text-[11px] font-bold text-emerald-600 uppercase">Strong</span>
                    <span class="text-[11px] text-slate-400">75% Secure</span>
                </div>
            </div>

            <!-- Confirm Password -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">Confirm password</label>
                <input type="password" value="S3cureP@ss!" placeholder="••••••••" class="w-full bg-white border border-slate-200 rounded-xl py-3.5 px-4 text-slate-900 font-medium input-focus">
            </div>

            <!-- Requirements -->
            <div class="bg-white/50 border border-slate-200 rounded-xl p-4 space-y-2">
                <div class="flex items-center gap-2 text-[12px] text-emerald-600 font-medium">
                    <i class="fas fa-check-circle"></i> 8+ characters
                </div>
                <div class="flex items-center gap-2 text-[12px] text-emerald-600 font-medium">
                    <i class="fas fa-check-circle"></i> One uppercase letter
                </div>
                <div class="flex items-center gap-2 text-[12px] text-emerald-600 font-medium">
                    <i class="fas fa-check-circle"></i> One number
                </div>
                <div class="flex items-center gap-2 text-[12px] text-emerald-600 font-medium">
                    <i class="fas fa-check-circle"></i> One special character
                </div>
            </div>

            <!-- Action -->
            <button class="w-full bg-[#dc2626] text-white font-bold py-4 rounded-xl shadow-lg shadow-red-500/20 active:scale-[0.98] transition-transform mt-4">
                Next <i class="fas fa-arrow-right ml-2"></i>
            </button>

            <!-- Login Link -->
            <div class="text-center mt-6">
                <p class="text-slate-500 text-sm">
                    Already have an account? 
                    <a href="#" class="text-[#dc2626] font-bold">Sign in</a>
                </p>
            </div>
        </div>

        <!-- Security Badge -->
        <div class="mt-8 flex justify-center items-center gap-2 opacity-50">
            <i class="fas fa-shield-halved text-slate-400"></i>
            <span class="text-[10px] text-slate-500 font-semibold tracking-tighter uppercase">TrendUp Secure Registration — AES-256</span>
        </div>
    </div>
</div>

<!-- PART 3 - FIXED BOTTOM NAV -->
<div style="position:fixed;bottom:0;left:0;right:0;z-index:50;background:#0F172A;border-top:1px solid rgba(255,255,255,0.06);height:70px;display:flex;align-items:center;justify-content:space-around;padding-bottom:8px;">
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><i class="fas fa-comment" style="font-size:20px;color:#dc2626"></i><span style="font-size:10px;font-weight:600;color:#dc2626">Messages</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><i class="fas fa-users" style="font-size:20px;color:#F8FAFC50"></i><span style="font-size:10px;font-weight:600;color:#F8FAFC50">Groups</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><i class="fas fa-address-book" style="font-size:20px;color:#F8FAFC50"></i><span style="font-size:10px;font-weight:600;color:#F8FAFC50">Contacts</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><i class="fas fa-gear" style="font-size:20px;color:#F8FAFC50"></i><span style="font-size:10px;font-weight:600;color:#F8FAFC50">Settings</span></div>
</div>

</body>
</html>" loading="lazy
